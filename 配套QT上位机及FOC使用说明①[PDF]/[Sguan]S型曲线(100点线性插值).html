<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>S 型速度 + 加速度 + LPF（100 点，含线性插值对比）</title>
<style>

<body>

<h2>S 型速度 + 加速度 + LPF（100 点，含线性插值对比）</h2>

<div class="controls">
  <div class="control-group">
    <label>X 轴缩放: <span class="value" id="xScaleVal">1.00</span></label>

  <div class="control-group">

  </div>
  <div class="control-group">
    <label>速度 Y 轴偏移: <span class="value" id="yOffsetVal">0.00</span></label>

  <div class="control-group">

  </div>
  <div class="control-group">
    <label>
      LPF 截止频率 ωc: <span class="value" id="wcVal">100.00</span> rad/s
    </label>

    <input type="number" id="wcInput" min="0.000001" step="0.01" value="100">
  </div>
  <div class="control-group">

    <input type="range" id="tsSlider" min="1" max="500" step="1" value="50">
  </div>
  <div class="control-group">
    <label>查表保持时间 T_sample: <span class="value" id="tsampVal">0.010</span> s</label>
    <input type="range" id="tsampSlider" min="1" max="200" step="1" value="10">
  </div>
  <div class="control-group">
    <label>起始 0 段 T_pre: <span class="value" id="tpreVal">0.050</span> s</label>
    <input type="range" id="tpreSlider" min="0" max="500" step="1" value="50">
  </div>
  <div class="control-group">
    <label>末尾 1 段 T_post: <span class="value" id="tpostVal">0.050</span> s</label>
    <input type="range" id="tpostSlider" min="0" max="500" step="1" value="50">
  </div>
</div>

<div class="checkbox-group">
  <label><input type="checkbox" id="showIdeal" checked> 理想速度</label>
  <label><input type="checkbox" id="showStep" checked> 阶梯输入</label>
  <label><input type="checkbox" id="showLPF" checked> LPF 速度(阶梯)</label>
  <label><input type="checkbox" id="showAccIdeal" checked> 理想加速度</label>
  <label><input type="checkbox" id="showAccLPF" checked> LPF 加速度(阶梯)</label>
  <label><input type="checkbox" id="showLin" checked> 线性插值速度</label>
  <label><input type="checkbox" id="showLinLPF" checked> LPF 速度(线性)</label>
  <label><input type="checkbox" id="showLinAcc" checked> LPF 加速度(线性)</label>
</div>

<canvas id="canvas" width="1100" height="560"></canvas>
<div class="info" id="info">鼠标悬停查看数值</div>
<div class="legend">
  <span class="blue">■ 理想速度</span>
  <span class="green">■ 阶梯输入</span>
  <span class="orange">■ LPF 速度(阶梯)</span>
  <span class="red">■ 理想加速度</span>
  <span class="purple">■ LPF 加速度(阶梯)</span>
  <span class="yellow">■ 线性插值速度</span>
  <span class="cyan">■ LPF 速度(线性)</span>
  <span class="pink">■ LPF 加速度(线性)</span>
</div>

<script>
/* ================== 数据 ================== */
const speed_tab = [
    0.000000000000000, 0.000204061405384, 0.000816243642475, 0.001836552750319,
    0.003264978528023, 0.005101525224745, 0.007346192840487, 0.009998980909586,
    0.013059905730188, 0.016528937965631, 0.020406091585755, 0.024691363796592,
    0.029384758323431, 0.034486301243305, 0.039995938539505, 0.045913696289063,
    0.052239574491978, 0.058973576873541, 0.066115736961365, 0.073665976524353,
    0.081624343991280, 0.089990831911564, 0.098765432834625, 0.107948206365108,
    0.117539055645466, 0.127538025379181, 0.137945115566254, 0.148760333657265,
    0.159983724355698, 0.171615183353424, 0.183654755353928, 0.196102455258369,
    0.208958268165588, 0.222222283482552, 0.235894337296486, 0.249974519014359,
    0.264462828636169, 0.279359251260757, 0.294663876295090, 0.310376554727554,
    0.326497316360474, 0.343026250600815, 0.359963268041611, 0.377308517694473,
    0.395061790943146, 0.413223177194595, 0.431792706251144, 0.450770318508148,
    0.470156192779541, 0.489950060844421, 0.510050058364868, 0.529843926429749,
    0.549229741096497, 0.568207383155823, 0.586776912212372, 0.604938328266144,
    0.622691571712494, 0.640036821365356, 0.656973838806152, 0.673502743244171,
    0.689623534679413, 0.705336213111877, 0.720640838146210, 0.735537230968475,
    0.750025570392609, 0.764105737209320, 0.777777791023254, 0.791041791439056,
    0.803897619247437, 0.816345334053040, 0.828384876251221, 0.840016305446625,
    0.851239740848541, 0.862054944038391, 0.872462034225464, 0.882461011409760,
    0.892051815986633, 0.901234626770020, 0.910009205341339, 0.918375670909882,
    0.926334083080292, 0.933884322643280, 0.941026449203491, 0.947760462760925,
    0.954086363315582, 0.960004091262817, 0.965513706207275, 0.970615267753601,
    0.975308656692505, 0.979593932628632, 0.983471095561981, 0.986940085887909,
    0.990001022815704, 0.992653846740723, 0.994898498058319, 0.996735036373138,
    0.998163461685181, 0.999183773994446, 0.999795913696289, 1.000000000000000
];

/* ================== 基本设置 ================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;
const PAD = 60;

const xScaleSlider = document.getElementById('xScale');
const yScaleSlider = document.getElementById('yScale');
const yOffsetSlider = document.getElementById('yOffset');
const aScaleSlider = document.getElementById('aScale');
const wcSlider = document.getElementById('wcSlider');
const wcInput = document.getElementById('wcInput');
const tsSlider = document.getElementById('tsSlider');
const tsampSlider = document.getElementById('tsampSlider');
const tpreSlider = document.getElementById('tpreSlider');
const tpostSlider = document.getElementById('tpostSlider');

const xScaleVal = document.getElementById('xScaleVal');
const yScaleVal = document.getElementById('yScaleVal');
const yOffsetVal = document.getElementById('yOffsetVal');
const aScaleVal = document.getElementById('aScaleVal');
const wcVal = document.getElementById('wcVal');
const tsVal = document.getElementById('tsVal');
const tsampVal = document.getElementById('tsampVal');
const tpreVal = document.getElementById('tpreVal');
const tpostVal = document.getElementById('tpostVal');

const showIdeal = document.getElementById('showIdeal');
const showStep = document.getElementById('showStep');
const showLPF = document.getElementById('showLPF');
const showAccIdeal = document.getElementById('showAccIdeal');
const showAccLPF = document.getElementById('showAccLPF');
const showLin = document.getElementById('showLin');
const showLinLPF = document.getElementById('showLinLPF');
const showLinAcc = document.getElementById('showLinAcc');

const info = document.getElementById('info');

let mouseX = -1;
let mouseY = -1;

const N = speed_tab.length;
const V_MIN = 0;
const V_MAX = 1;

let xScale = 1;
let yScale = 1;
let yOffset = 0;
let aScale = 1;

let wc = 100;
let TS = 50e-6;
let T_SAMPLE = 10e-3;
let T_PRE = 50e-3;
let T_POST = 50e-3;

let simTime = [];
let simStep = [];
let simLPF = [];
let simIdeal = [];
let simAccIdeal = [];
let simAccLPF = [];

/* 新增：线性插值对比 */
let simLin = [];
let simLinLPF = [];
let simLinAcc = [];

/* 加速度固定参考值 */
const A_REF = 1.0;

/* ================== 理想 S 型速度与加速度 ================== */
function idealSpeedAt(tRel, T_S) {
    if (tRel <= 0) return 0;
    if (tRel >= T_S) return 1;
    const K = 4 / (T_S * T_S);
    const half = T_S / 2;
    if (tRel <= half) {
        return 0.5 * K * tRel * tRel;
    } else {
        const dt = T_S - tRel;
        return 1 - 0.5 * K * dt * dt;
    }
}

function idealAccAt(tRel, T_S) {
    if (tRel <= 0) return 0;
    if (tRel >= T_S) return 0;
    const K = 4 / (T_S * T_S);
    const half = T_S / 2;
    if (tRel <= half) {
        return K * tRel;
    } else {
        return K * (T_S - tRel);
    }
}

/* ================== 线性插值输入 ================== */
function linearInputAt(t) {
    if (t < T_PRE) return 0;
    const T_S = (N - 1) * T_SAMPLE;
    if (t >= T_PRE + T_S) return 1;
    const tRel = t - T_PRE;
    const idxF = tRel / T_SAMPLE;
    if (idxF <= 0) return speed_tab[0];
    if (idxF >= N - 1) return speed_tab[N - 1];
    const i0 = Math.floor(idxF);
    const i1 = i0 + 1;
    const frac = idxF - i0;
    return speed_tab[i0] * (1 - frac) + speed_tab[i1] * frac;
}

/* ================== 真实离散仿真 ================== */
function computeSimulation() {
    simTime = [];
    simStep = [];
    simLPF = [];
    simIdeal = [];
    simAccIdeal = [];
    simAccLPF = [];
    simLin = [];
    simLinLPF = [];
    simLinAcc = [];

    const T_S = (N - 1) * T_SAMPLE;
    const T_total = T_PRE + T_S + T_POST;
    const totalSteps = Math.round(T_total / TS);

    const alpha = (wc * TS) / (1 + wc * TS);

    let yStep = 0;
    let yLin = 0;

    function stepInputAt(t) {
        if (t < T_PRE) return 0;
        if (t < T_PRE + T_S) {
            const tRel = t - T_PRE;
            let idx = Math.floor(tRel / T_SAMPLE);
            if (idx < 0) idx = 0;
            if (idx >= N) idx = N - 1;
            return speed_tab[idx];
        }
        return 1;
    }

    for (let k = 0; k <= totalSteps; k++) {
        const t = k * TS;
        const xStep = stepInputAt(t);
        const xLin = linearInputAt(t);

        yStep = yStep + alpha * (xStep - yStep);
        yLin  = yLin  + alpha * (xLin  - yLin);

        let vIdeal;
        let aIdeal;
        if (t < T_PRE) {
            vIdeal = 0;
            aIdeal = 0;
        } else if (t < T_PRE + T_S) {
            const tRel = t - T_PRE;
            vIdeal = idealSpeedAt(tRel, T_S);
            aIdeal = idealAccAt(tRel, T_S);
        } else {
            vIdeal = 1;
            aIdeal = 0;
        }

        simTime.push(t);
        simStep.push(xStep);
        simLPF.push(yStep);
        simIdeal.push(vIdeal);
        simAccIdeal.push(aIdeal);

        simLin.push(xLin);
        simLinLPF.push(yLin);
    }

    /* LPF 加速度(阶梯)：对 LPF 速度做中心差分 */
    const n = simTime.length;
    simAccLPF = new Array(n).fill(0);
    for (let k = 1; k < n - 1; k++) {
        const dt = simTime[k + 1] - simTime[k - 1];
        simAccLPF[k] = (simLPF[k + 1] - simLPF[k - 1]) / dt;
    }
    simAccLPF[0] = simAccLPF[1] || 0;
    simAccLPF[n - 1] = simAccLPF[n - 2] || 0;

    /* LPF 加速度(线性)：对线性插值 LPF 速度做中心差分 */
    simLinAcc = new Array(n).fill(0);
    for (let k = 1; k < n - 1; k++) {
        const dt = simTime[k + 1] - simTime[k - 1];
        simLinAcc[k] = (simLinLPF[k + 1] - simLinLPF[k - 1]) / dt;
    }
    simLinAcc[0] = simLinAcc[1] || 0;
    simLinAcc[n - 1] = simLinAcc[n - 2] || 0;

    /* 轻微滑动平均，去掉数值差分毛刺 */
    const win = 5;
    smoothInPlace(simAccLPF, win);
    smoothInPlace(simLinAcc, win);
}

function smoothInPlace(arr, win) {
    const n = arr.length;
    const tmp = arr.slice();
    for (let k = 0; k < n; k++) {
        let sum = 0;
        let cnt = 0;
        for (let j = -win; j <= win; j++) {
            const idx = k + j;
            if (idx >= 0 && idx < n) {
                sum += tmp[idx];
                cnt++;
            }
        }
        arr[k] = sum / cnt;
    }
}

/* ================== 坐标映射 ================== */
let T_MIN = 0;
let T_MAX = 1;

function updateRange() {
    T_MIN = 0;
    T_MAX = simTime.length > 0 ? simTime[simTime.length - 1] : 1;
}

function dataToScreenX(t) {
    const norm = (t - T_MIN) / (T_MAX - T_MIN);
    const scaled = 0.5 + (norm - 0.5) * xScale;
    return PAD + scaled * (W - 2 * PAD);
}

function dataToScreenY(v) {
    const norm = (v - V_MIN) / (V_MAX - V_MIN);
    const scaled = 0.5 + (norm - 0.5) * yScale + yOffset;
    return H - PAD - scaled * (H - 2 * PAD);
}

function accToScreenY(a) {
    const norm = a / A_REF;
    const scaled = norm * 0.5 * aScale;
    return H - PAD - scaled * (H - 2 * PAD);
}

function screenToDataX(sx) {
    const scaled = (sx - PAD) / (W - 2 * PAD);
    const norm = 0.5 + (scaled - 0.5) / xScale;
    return T_MIN + norm * (T_MAX - T_MIN);
}

function screenToDataY(sy) {
    const scaled = (H - PAD - sy) / (H - 2 * PAD);
    const norm = (scaled - 0.5 - yOffset) / yScale + 0.5;
    return V_MIN + norm * (V_MAX - V_MIN);
}

/* ================== 绘制 ================== */
function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 10; i++) {
        const y = PAD + (H - 2 * PAD) * i / 10;
        ctx.beginPath();
        ctx.moveTo(PAD, y);
        ctx.lineTo(W - PAD, y);
        ctx.stroke();
    }
    for (let i = 0; i <= 10; i++) {
        const x = PAD + (W - 2 * PAD) * i / 10;
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, H - PAD);
        ctx.stroke();
    }

    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(PAD, H - PAD);
    ctx.lineTo(W - PAD, H - PAD);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(PAD, PAD);
    ctx.lineTo(PAD, H - PAD);
    ctx.stroke();

    ctx.fillStyle = '#aaa';
    ctx.font = '14px Arial';
    ctx.fillText('时间 t (s)', W - PAD - 80, H - PAD + 30);
    ctx.fillText('速度 v / 加速度 a', PAD - 50, PAD - 10);

    ctx.font = '12px monospace';
    ctx.fillStyle = '#888';
    for (let i = 0; i <= 10; i++) {
        const y = PAD + (H - 2 * PAD) * i / 10;
        const v = screenToDataY(y);
        if (v >= -0.5 && v <= 1.5) {
            ctx.fillText(v.toFixed(2), PAD - 50, y + 4);
        }
    }

    for (let i = 0; i <= 10; i++) {
        const x = PAD + (W - 2 * PAD) * i / 10;
        const t = screenToDataX(x);
        if (t >= -T_MAX * 0.05 && t <= T_MAX * 1.05) {
            ctx.fillText(t.toFixed(3), x - 20, H - PAD + 18);
        }
    }

    if (simTime.length === 0) return;

    /* 理想速度 */
    if (showIdeal.checked) {
        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = dataToScreenY(simIdeal[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* 阶梯输入 */
    if (showStep.checked) {
        ctx.strokeStyle = '#66bb6a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = dataToScreenY(simStep[k]);
            if (k === 0) {
                ctx.moveTo(x, y);
            } else {
                const xPrev = dataToScreenX(simTime[k - 1]);
                const yPrev = dataToScreenY(simStep[k - 1]);
                ctx.lineTo(x, yPrev);
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
    }

    /* LPF 速度(阶梯) */
    if (showLPF.checked) {
        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = dataToScreenY(simLPF[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* 理想加速度 */
    if (showAccIdeal.checked) {
        ctx.strokeStyle = '#ef5350';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = accToScreenY(simAccIdeal[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* LPF 加速度(阶梯) */
    if (showAccLPF.checked) {
        ctx.strokeStyle = '#ab47bc';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = accToScreenY(simAccLPF[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* 线性插值速度 */
    if (showLin.checked) {
        ctx.strokeStyle = '#ffee58';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = dataToScreenY(simLin[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* LPF 速度(线性) */
    if (showLinLPF.checked) {
        ctx.strokeStyle = '#26c6da';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = dataToScreenY(simLinLPF[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* LPF 加速度(线性) */
    if (showLinAcc.checked) {
        ctx.strokeStyle = '#ec407a';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let k = 0; k < simTime.length; k++) {
            const x = dataToScreenX(simTime[k]);
            const y = accToScreenY(simLinAcc[k]);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    /* 悬停 */
    if (mouseX >= PAD && mouseX <= W - PAD && mouseY >= PAD && mouseY <= H - PAD) {
        const tHover = screenToDataX(mouseX);
        let idx = Math.round(tHover / TS);
        if (idx < 0) idx = 0;
        if (idx >= simTime.length) idx = simTime.length - 1;

        const x = dataToScreenX(simTime[idx]);

        ctx.strokeStyle = '#ff9800';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x, PAD);
        ctx.lineTo(x, H - PAD);
        ctx.stroke();
        ctx.setLineDash([]);

        info.textContent =
            `t = ${simTime[idx].toFixed(6)} s    ` +
            `理想v = ${simIdeal[idx].toFixed(6)}    ` +
            `LPFv(阶梯) = ${simLPF[idx].toFixed(6)}    ` +
            `理想a = ${simAccIdeal[idx].toFixed(6)}    ` +
            `LPFa(阶梯) = ${simAccLPF[idx].toFixed(6)}    ` +
            `线性v = ${simLin[idx].toFixed(6)}    ` +
            `LPFv(线性) = ${simLinLPF[idx].toFixed(6)}    ` +
            `LPFa(线性) = ${simLinAcc[idx].toFixed(6)}`;
    } else {
        info.textContent = '鼠标悬停查看数值';
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '13px monospace';
    ctx.fillText(`X 缩放 = ${xScale.toFixed(2)}`, PAD + 10, PAD + 18);
    ctx.fillText(`速度 Y 缩放 = ${yScale.toFixed(2)}`, PAD + 10, PAD + 36);
    ctx.fillText(`速度 Y 偏移 = ${yOffset.toFixed(2)}`, PAD + 10, PAD + 54);
    ctx.fillText(`加速度 Y 缩放 = ${aScale.toFixed(2)}`, PAD + 10, PAD + 72);
    ctx.fillText(`ωc = ${wc.toFixed(2)} rad/s`, PAD + 10, PAD + 90);
    ctx.fillText(`TS = ${(TS * 1e6).toFixed(1)} µs`, PAD + 10, PAD + 108);
    ctx.fillText(`T_sample = ${(T_SAMPLE * 1e3).toFixed(1)} ms`, PAD + 10, PAD + 126);
    ctx.fillText(`T_pre = ${(T_PRE * 1e3).toFixed(1)} ms`, PAD + 10, PAD + 144);
    ctx.fillText(`T_post = ${(T_POST * 1e3).toFixed(1)} ms`, PAD + 10, PAD + 162);
    ctx.fillText(`总时间 = ${T_MAX.toFixed(3)} s`, PAD + 10, PAD + 180);
}

/* ================== 事件 ================== */
function refresh() {
    computeSimulation();
    updateRange();
    draw();
}

function autoInitAScale() {
    const T_S = (N - 1) * T_SAMPLE;
    const aMax = 2 / T_S;
    let s = A_REF / aMax;
    if (s < 0.1) s = 0.1;
    if (s > 10) s = 10;
    aScale = s;
    aScaleSlider.value = s;
    aScaleVal.textContent = s.toFixed(2);
}

xScaleSlider.addEventListener('input', () => {
    xScale = parseFloat(xScaleSlider.value);
    xScaleVal.textContent = xScale.toFixed(2);
    draw();
});

yScaleSlider.addEventListener('input', () => {
    yScale = parseFloat(yScaleSlider.value);
    yScaleVal.textContent = yScale.toFixed(2);
    draw();
});

yOffsetSlider.addEventListener('input', () => {
    yOffset = parseFloat(yOffsetSlider.value);
    yOffsetVal.textContent = yOffset.toFixed(2);
    draw();
});

aScaleSlider.addEventListener('input', () => {
    aScale = parseFloat(aScaleSlider.value);
    aScaleVal.textContent = aScale.toFixed(2);
    draw();
});

wcSlider.addEventListener('input', () => {
    wc = parseFloat(wcSlider.value);
    wcVal.textContent = wc.toFixed(2);
    wcInput.value = wc.toFixed(2);
    refresh();
});

function applyWcInput() {
    let v = parseFloat(wcInput.value);
    if (!isFinite(v) || v <= 0) {
        wcInput.value = wc.toFixed(2);
        return;
    }
    wc = v;
    wcVal.textContent = wc.toFixed(2);
    if (wc >= parseFloat(wcSlider.min) && wc <= parseFloat(wcSlider.max)) {
        wcSlider.value = wc;
    }
    refresh();
}
wcInput.addEventListener('change', applyWcInput);
wcInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        applyWcInput();
    }
});

tsSlider.addEventListener('input', () => {
    const us = parseFloat(tsSlider.value);
    TS = us * 1e-6;
    tsVal.textContent = TS.toFixed(6);
    refresh();
});

tsampSlider.addEventListener('input', () => {
    const ms = parseFloat(tsampSlider.value);
    T_SAMPLE = ms * 1e-3;
    tsampVal.textContent = T_SAMPLE.toFixed(3);
    autoInitAScale();
    refresh();
});

tpreSlider.addEventListener('input', () => {
    const ms = parseFloat(tpreSlider.value);
    T_PRE = ms * 1e-3;
    tpreVal.textContent = T_PRE.toFixed(3);
    refresh();
});

tpostSlider.addEventListener('input', () => {
    const ms = parseFloat(tpostSlider.value);
    T_POST = ms * 1e-3;
    tpostVal.textContent = T_POST.toFixed(3);
    refresh();
});

showIdeal.addEventListener('change', draw);
showStep.addEventListener('change', draw);
showLPF.addEventListener('change', draw);
showAccIdeal.addEventListener('change', draw);
showAccLPF.addEventListener('change', draw);
showLin.addEventListener('change', draw);
showLinLPF.addEventListener('change', draw);
showLinAcc.addEventListener('change', draw);

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
    mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    draw();
});

canvas.addEventListener('mouseleave', () => {
    mouseX = -1;
    mouseY = -1;
    draw();
});

/* 初始化 */
autoInitAScale();
refresh();
</script>
</body>
</html>
